<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tiny Talkers NI</title>
  <script>
    // GitHub Pages has no server-side router, so a direct hit on a deep
    // route (e.g. /tinytalkers-ni/about) 404s. Encode the intended path
    // into a query string and bounce to the SPA shell, which decodes it
    // back (see the inline script in index.html) before React Router
    // takes over. https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 1; // "/tinytalkers-ni"
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
